name: trackforge
description: "TrackForge — AI-Powered Personal Health & Fitness Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.3

  # HTTP Client
  dio: ^5.7.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.69.0

  # Markdown Renderer
  flutter_markdown_plus: 1.0.7

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Image Picker (calorie vision)
  image_picker: ^1.1.2

  pedometer: ^4.0.2

  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  timezone: ^0.9.4

  # Barcode Scanner
  mobile_scanner: ^5.2.3

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/muscle_front_and_back.svg
    - assets/images/splash_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0d0d0d"
  background_image: assets/images/splash_bg.png
  image: assets/images/app_icon.png
  color_dark: "#0d0d0d"
  background_image_dark: assets/images/splash_bg.png
  image_dark: assets/images/app_icon.png
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0d0d0d"
    image: assets/images/app_icon.png
    icon_background_color: "#0d0d0d"