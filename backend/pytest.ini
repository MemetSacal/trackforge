[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
env_files = .env.test
markers =
    p0: Blocker — deploy öncesi mutlaka geçmeli
    p1: Critical — release blocker
    p2: High — regression coverage
    p3: Medium — nice to have
    regression: Son 23 bug fix regression testi
    security: Güvenlik testleri
    slow: 5s+ süren testler (AI çağrıları vb.)
